<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="180" viewBox="0 0 1200 180"
     role="img" aria-labelledby="hh-title hh-desc">
  <title id="hh-title">HITL과 HOTL 비교</title>
  <desc id="hh-desc">HITL은 FDC 인터록이 임계치(1건)를 넘으면 발행을 멈추고 사람 승인을 기다리고, HOTL은 항상 공정 노드별 다이 수율을 계산하며 전분기 대비 급락 구간만 표시해 사람이 필요할 때 개입합니다</desc>

  <g id="hitl" transform="translate(56 22)">
    <rect x="0" y="0" width="524" height="136" rx="12" fill="#14171B" stroke="#D98C33" stroke-width="1.5"/>
    <path d="M34,42 L52,60 L34,78 L16,60 Z" fill="none" stroke="#D98C33" stroke-width="2"/>
    <circle cx="34" cy="60" r="4" fill="#D98C33"/>
    <text x="72" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#F3F1EA">HITL</text>
    <text x="72" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8B93A1">Human-in-the-loop · insight_agent/hitl/</text>
    <text x="34" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D6D0C4">FDC 인터록 &#8805; 1건이면 발행을 멈추고</text>
    <text x="34" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D6D0C4">사람이 승인해야 outputs/에 리포트가 남는다</text>
  </g>

  <g id="hotl" transform="translate(620 22)">
    <rect x="0" y="0" width="524" height="136" rx="12" fill="#14171B" stroke="#2A2F35" stroke-width="1.5"/>
    <circle cx="34" cy="60" r="18" fill="none" stroke="#6B7280" stroke-width="2"/>
    <path d="M25,56 L30,64 L34,58 L43,66" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#F3F1EA">HOTL</text>
    <text x="72" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8B93A1">Human-on-the-loop · insight_agent/hotl/</text>
    <text x="34" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D6D0C4">승인 대기 없이 공정 노드별 다이 수율을 계산하고,</text>
    <text x="34" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D6D0C4">전분기 대비 -0.5%p 이하 급락만 alerts에 표시</text>
  </g>
</svg>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>반도체 DS·DX 인사이트 에이전트</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">반도체 DS·DX 인사이트 에이전트</div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="chat">대화형 분석</button>
    <button class="tab-btn" data-tab="outputs">산출물</button>
  </nav>

  <main>
    <section id="tab-chat" class="tab-panel active">
      <div class="chat-layout">
        <div class="chat-col">
          <div class="chat-header-row">
            <span id="chat-turn-count" class="status-text">대화를 시작해보세요.</span>
            <button id="chat-save-report-btn" type="button">리포트 저장 (.md)</button>
          </div>
          <div id="chat-messages" class="chat-messages"></div>
          <div id="chat-suggestions" class="chat-suggestions"></div>
          <form id="chat-form" class="chat-input-row">
            <input id="chat-input" type="text" placeholder="예: LOT-2309-50001 원인 분석해줘" autocomplete="off" />
            <button type="submit">보내기</button>
          </form>
        </div>
        <div class="pipeline-col">
          <h3>멀티에이전트 오케스트레이션 파이프라인</h3>
          <div id="pipeline-viz" class="pipeline-viz"></div>
          <div class="graph-context">
            <h4>GraphRAG 컨텍스트</h4>
            <pre id="graph-context-body" class="graph-context-body status-text">대화를 시작하면 관련 지식 그래프 사실이 표시됩니다.</pre>
          </div>
        </div>
      </div>
    </section>

    <section id="tab-outputs" class="tab-panel">
      <div class="subtabs">
        <button class="subtab-btn active" data-output="report">대화 리포트</button>
        <button class="subtab-btn" data-output="prd">PRD</button>
      </div>

      <div id="output-report" class="output-panel active">
        <div class="split">
          <div class="split-left">
            <h3>저장된 대화 리포트</h3>
            <button id="report-refresh-btn">목록 새로고침</button>
            <div id="report-list" class="list"></div>
          </div>
          <div class="split-right">
            <div id="report-content" class="markdown-body">
              왼쪽에서 리포트를 선택하세요. "대화형 분석" 탭에서 "리포트 저장" 버튼을
              누르면 현재까지의 대화가 .md 파일로 저장됩니다.
            </div>
          </div>
        </div>
      </div>

      <div id="output-prd" class="output-panel">
        <div id="prd-banner" class="prd-banner"></div>
        <div id="prd-content" class="markdown-body">불러오는 중...</div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
